<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백하은 검색</title>
<style>
@font-face{font-family:"MaruBuri";font-weight:400;src:url("https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"MaruBuri";font-weight:700;src:url("https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2") format("woff2");font-display:swap}

:root{
  --paper:#fff;
  --ink:#16181a;
  --quiet:#5b6066;
  --green:#03C75A;
  --lens:132px;
  --serif:"MaruBuri","Nanum Myeongjo","AppleMyungjo","Batang",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.65;-webkit-tap-highlight-color:transparent}
::selection{background:var(--green);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
main{flex:1;width:100%;max-width:41rem;margin:0 auto;padding:27vh 1.5rem 4rem}

.field{position:relative}
.field input{
  display:block;width:100%;margin:0;padding:.1em 0 .28em;
  border:0;border-bottom:2px solid var(--ink);border-radius:0;outline:0;
  background:none;color:var(--ink);caret-color:var(--green);
  font:700 clamp(1.75rem,6vw,2.75rem)/1.3 var(--serif);letter-spacing:-.015em;
  appearance:none;-webkit-appearance:none;
}
.field input::-webkit-search-cancel-button{display:none}
.field input:focus-visible{border-bottom-color:var(--green);box-shadow:0 2px 0 var(--green)}
.mirror{position:absolute;left:0;top:0;visibility:hidden;white-space:pre;pointer-events:none;
  font:700 clamp(1.75rem,6vw,2.75rem)/1.3 var(--serif);letter-spacing:-.015em;padding:.1em 0 .28em}
.caret{position:absolute;left:0;top:.2em;width:3px;height:clamp(1.75rem,6vw,2.75rem);margin-top:.12em;background:var(--green);pointer-events:none}
.field input:focus ~ .caret{display:none}

.results{list-style:none;margin:2.75rem 0 0;padding:0}
.results li{margin:0 0 2rem}
.results h2{margin:0;font-size:1.25rem;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.results p{margin:.2rem 0 0;font-variant-numeric:tabular-nums;text-wrap:pretty}
.results .tag{margin-top:.15rem;color:var(--quiet);font-size:.9375rem}
.results a{color:inherit;text-decoration-color:var(--green);text-decoration-thickness:2px;text-underline-offset:.22em;border-radius:2px}
mark{background:var(--green);color:var(--ink);padding:.02em .1em;margin:0 -.02em;border-radius:2px}

.words{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin:2.75rem 0 0}
.words[hidden]{display:none}
.words button{
  appearance:none;border:0;background:none;color:var(--ink);padding:.35rem 0;min-height:44px;
  font:400 1.25rem/1.4 var(--serif);border-radius:2px;
  text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:3px;text-underline-offset:.3em;
  transition:scale 150ms ease-out;
}
.words button:active{scale:.96}
a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:4px}

footer{width:100%;max-width:41rem;margin:0 auto;padding:0 1.5rem 1.5rem;color:var(--quiet);font-size:.8125rem;line-height:1.6}
footer p{margin:0}

/* 돋보기 */
.lens{position:fixed;left:0;top:0;z-index:10;width:var(--lens);height:var(--lens);pointer-events:none;opacity:0;transition:opacity 150ms ease-out}
.lens.on{opacity:1}
.lens::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:5px;margin-top:-2.5px;border-radius:0 3px 3px 0;background:var(--ink);
  transform-origin:0 50%;transform:rotate(45deg) translateX(calc(var(--lens) / 2))}
.glass{position:absolute;inset:0;overflow:hidden;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.lens.hot .glass{border-color:var(--green)}
.lens.hot::after{background:var(--green)}
.glass > div{position:absolute;left:0;top:0;transform-origin:0 0}
.lens.glide,.lens.glide .glass > div{transition:transform 520ms cubic-bezier(.2,0,0,1),opacity 150ms ease-out}
@media (hover:hover) and (pointer:fine){
  html.loupe,html.loupe *{cursor:none}
  .words button:hover{text-decoration-thickness:5px}
}
@media (max-width:520px){
  :root{--lens:108px}
  main{padding-top:18vh}
}
@media (prefers-reduced-motion:no-preference){
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
@media (prefers-reduced-motion:reduce){
  .lens.glide,.lens.glide .glass > div{transition:none}
  .words button{transition:none}
}
</style>
</head>
<body>
<div class="page" id="page">
  <main>
    <h1 class="sr">백하은 포트폴리오 검색</h1>
    <div class="field">
      <input id="q" type="search" aria-label="검색" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <span class="mirror" aria-hidden="true"></span>
      <span class="caret" aria-hidden="true"></span>
    </div>
    <ul id="results" class="results"></ul>
    <div id="words" class="words" hidden></div>
    <p class="sr" id="status" role="status"></p>
  </main>
  <footer><p>데모용으로 만든 가상의 인물입니다. 네이버와 아무 관계가 없고, 공고 요건도 가상으로 만든 것입니다.</p></footer>
</div>
<div class="lens" aria-hidden="true"><div class="glass"><div></div></div></div>

<script>
(() => {
  const ITEMS = [
    { t: "백하은", b: "전주대학교 컴퓨터공학과 4학년. 네이버 프론트엔드 개발자 신입 지원.", g: "메일", m: "haeun@example.com", k: "연락 이름 학교 전주대" },
    { t: "캡스톤 시간표 앱", b: "주간 사용자 900명. Lighthouse 성능 62에서 96.", g: "React, 성능 측정", k: "프로젝트" },
    { t: "교내 수강 후기 검색", b: "검색 응답 1.8초에서 0.4초. 후기 2만 3천 건.", g: "TypeScript, 성능 측정", k: "프로젝트 속도" },
    { t: "접근성 점검 도구", b: "학교 홈페이지 40쪽 점검. 오류 312개 보고, 180개 반영.", g: "TypeScript, 웹 접근성", k: "프로젝트 표준" },
    { t: "웹 표준과 접근성", b: "학교 홈페이지 오류 312개 보고, 180개 반영.", g: "공고 요건", k: "" },
    { t: "컴포넌트 기반 개발", b: "시간표 앱 화면 전체를 React 컴포넌트로 작성.", g: "공고 요건", k: "캡스톤" },
    { t: "성능 측정과 개선", b: "Lighthouse 62에서 96. 검색 응답 0.4초.", g: "공고 요건", k: "" },
    { t: "코드 리뷰와 협업", b: "캡스톤 4인 팀, 풀 리퀘스트마다 리뷰.", g: "공고 요건", k: "" },
    { t: "많은 사용자가 쓰는 서비스", b: "주간 사용자 900명, 후기 2만 3천 건.", g: "공고 요건", k: "관심" }
  ];
  const WORDS = ["성능", "접근성", "공고", "검색", "캡스톤", "React", "메일"];
  const QUERIES = ["백하은 성능", "백하은 접근성", "공고", "백하은"];
  const NAME = "백하은";

  const $ = (s) => document.querySelector(s);
  const q = $("#q"), list = $("#results"), words = $("#words"), status = $("#status");
  const page = $("#page"), mirror = $(".mirror"), caret = $(".caret");
  const lens = $(".lens"), inner = $(".glass > div");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SCALE = 1.28;

  ITEMS.forEach((it, i) => {
    it.i = i;
    it.hay = [it.t, it.b, it.g, it.m || "", it.k, NAME].join(" ").toLowerCase();
    it.el = document.createElement("li");
    it.el.hidden = true;
    list.append(it.el);
  });
  WORDS.forEach((w) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = w;
    b.addEventListener("click", () => { stopDemo(); q.value = w; update(true); });
    words.append(b);
  });

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const count = (text, re) => (re ? (text.match(re) || []).length : 0);
  const paint = (text, re) => {
    if (!re) return esc(text);
    let out = "", last = 0;
    for (const m of text.matchAll(re)) {
      out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  };

  let demo = !still, touched = false;

  function update(animate) {
    const raw = q.value.trim().toLowerCase();
    const tokens = [...new Set(raw.split(/\s+/).filter(Boolean))]
      .filter((t) => ITEMS.some((it) => it.hay.includes(t)));
    const re = tokens.length
      ? new RegExp(tokens.slice().sort((a, b) => b.length - a.length).map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi")
      : null;

    const hits = tokens.length
      ? ITEMS.filter((it) => tokens.every((t) => it.hay.includes(t)))
          .map((it) => ({ it, s: count(it.t, re) * 2 + count(it.b, re) + count(it.g, re) }))
          .sort((a, b) => b.s - a.s || a.it.i - b.it.i)
          .map((x) => x.it)
      : [];

    const before = new Map();
    ITEMS.forEach((it) => { if (!it.el.hidden) before.set(it, it.el.getBoundingClientRect().top); });

    ITEMS.forEach((it) => { it.el.hidden = !hits.includes(it); });
    hits.forEach((it) => {
      const tag = paint(it.g, re) + (it.m ? ' <a href="mailto:' + it.m + '">' + paint(it.m, re) + "</a>" : "");
      it.el.innerHTML = "<h2>" + paint(it.t, re) + "</h2><p>" + paint(it.b, re) + '</p><p class="tag">' + tag + "</p>";
      list.append(it.el);
    });
    words.hidden = hits.length > 0 || (!raw && !touched);

    if (animate && !still) {
      hits.forEach((it) => {
        const now = it.el.getBoundingClientRect().top;
        if (before.has(it)) {
          const dy = before.get(it) - now;
          if (dy) it.el.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,0,0,1)" });
        } else {
          it.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: "ease-out" });
        }
      });
    }

    if (touched) {
      status.textContent = hits.length ? "결과 " + hits.length + "건" : "맞는 결과가 없습니다. 칠 수 있는 낱말: " + WORDS.join(", ");
    }
    mirror.textContent = q.value;
    caret.style.transform = "translateX(" + (mirror.offsetWidth + 2) + "px)";
    syncLens();
    if (resting) rest();
  }

  /* 돋보기: 페이지를 복제해 렌즈 안에서 키운다 */
  let lx = 0, ly = 0, resting = true;

  function syncLens() {
    const copy = page.cloneNode(true);
    copy.inert = true;
    copy.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
    copy.querySelectorAll(".sr").forEach((n) => n.remove());
    const input = copy.querySelector("input");
    input.value = q.value;
    input.tabIndex = -1;
    inner.replaceChildren(copy);
    place();
  }
  function place() {
    const r = lens.offsetWidth / 2;
    const box = page.getBoundingClientRect();
    inner.style.width = box.width + "px";
    lens.style.transform = "translate(" + (lx - r) + "px," + (ly - r) + "px)";
    inner.style.transform = "translate(" + (r - (lx - box.left) * SCALE) + "px," + (r - (ly - box.top) * SCALE) + "px) scale(" + SCALE + ")";
  }
  function rest() {
    const target = list.querySelector("li:not([hidden]) mark") || caret;
    const b = target.getBoundingClientRect();
    lx = b.left + b.width / 2;
    ly = b.top + b.height / 2;
    lens.classList.remove("hot");
    place();
    lens.classList.add("on");
    requestAnimationFrame(() => { if (resting) lens.classList.add("glide"); });
  }
  function follow(x, y) {
    resting = false;
    lx = x; ly = y;
    lens.classList.remove("glide");
    lens.classList.add("on");
    const under = document.elementFromPoint(x, y);
    lens.classList.toggle("hot", !!(under && under.closest("a,button")));
    place();
  }
  function release() {
    if (touched) { resting = false; lens.classList.remove("on"); }
    else { resting = true; rest(); }
  }

  addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") { follow(e.clientX, e.clientY - 84); return; }
    document.documentElement.classList.add("loupe");
    follow(e.clientX, e.clientY);
  }, { passive: true });
  addEventListener("pointerdown", (e) => { if (e.pointerType === "touch") follow(e.clientX, e.clientY - 84); }, { passive: true });
  addEventListener("pointerup", (e) => { if (e.pointerType === "touch") release(); }, { passive: true });
  addEventListener("pointercancel", release, { passive: true });
  document.documentElement.addEventListener("pointerleave", release);
  addEventListener("scroll", () => { resting ? rest() : place(); }, { passive: true });
  addEventListener("resize", () => { update(false); });

  /* 스스로 치는 검색어 */
  const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
  function strokes(ch) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c < 0 || c > 11171) return [ch];
    const jong = c % 28, open = String.fromCharCode(0xac00 + c - jong);
    const out = [CHO[Math.floor(c / 588)], open];
    if (jong) out.push(ch);
    return out;
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function stopDemo() {
    demo = false;
    touched = true;
  }
  async function run() {
    await wait(700);
    for (let i = 0; demo; i++) {
      const target = QUERIES[i % QUERIES.length];
      while (demo && !target.startsWith(q.value)) {
        q.value = q.value.slice(0, -1);
        update(true);
        await wait(55);
      }
      let base = q.value;
      for (const ch of target.slice(base.length)) {
        for (const s of strokes(ch)) {
          if (!demo) return;
          q.value = base + s;
          update(true);
          await wait(95);
        }
        base += ch;
      }
      await wait(3400);
    }
  }

  q.addEventListener("focus", () => {
    if (demo) { stopDemo(); q.select(); }
  });
  q.addEventListener("input", () => { stopDemo(); update(true); });
  q.addEventListener("keydown", () => { resting = false; lens.classList.remove("on"); });

  if (still) q.value = QUERIES[0];
  update(false);
  if (document.fonts) {
    document.fonts.ready.then(() => update(false));
    document.fonts.addEventListener("loadingdone", () => update(false));
  }
  if (!still) run();
})();
</script>
</body>
</html>
