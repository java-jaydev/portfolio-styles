const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const main = document.getElementById("main");
main.innerHTML = SETS.map(set => {
  const list = ITEMS.map((it, i) => [it, i]).filter(([it]) => it.set === set.id);
  if (!list.length) return "";
  return (new Set(ITEMS.map(x => x.set)).size > 1 ? `<p class="set">${esc(set.label)}</p>` : "") + `<div class="grid">` + list.map(([it, i]) => `
    <div class="item">
      <a class="shot" href="${it.file}" aria-label="${esc(it.name)}">
        <img src="${it.thumb}" alt="" loading="lazy" width="900" height="562">
      </a>
      <div class="cap"><span><b>${esc(it.name)}</b><span class="role">${esc(it.role)}</span></span><button type="button" data-p="${i}">프롬프트</button></div>
      <div class="by"><a href="https://github.com/${it.maker}">${esc(it.maker)}</a>, ${esc(it.model)}</div>
    </div>`).join("") + `</div>`;
}).join("");

if (matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches) {
  document.querySelectorAll(".shot").forEach(shot => {
    let timer = null, frame = null;
    shot.addEventListener("pointerenter", () => {
      if (frame || timer) return;
      timer = setTimeout(() => {
        timer = null;
        frame = document.createElement("iframe");
        frame.src = shot.getAttribute("href");
        frame.tabIndex = -1;
        frame.setAttribute("aria-hidden", "true");
        frame.style.transform = `scale(${shot.clientWidth / 1280})`;
        frame.addEventListener("load", () => frame && frame.classList.add("on"));
        shot.appendChild(frame);
      }, 220);
    });
    shot.addEventListener("pointerleave", () => {
      clearTimeout(timer); timer = null;
      if (frame) { frame.remove(); frame = null; }
    });
  });
}

const dlg = document.getElementById("dlg"), $ = id => document.getElementById(id);
let current = "";
main.addEventListener("click", e => {
  const b = e.target.closest("[data-p]");
  if (!b) return;
  const it = ITEMS[+b.dataset.p];
  current = it.prompt;
  $("dtitle").textContent = it.name;
  $("dmeta").textContent = it.model + ", " + it.maker;
  $("dprompt").textContent = current;
  $("dorig").href = REPO + it.orig;
  $("dopen").href = it.file;
  $("dcopy").textContent = "복사";
  dlg.showModal();
});
$("dclose").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
$("dcopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(current); $("dcopy").textContent = "복사됨"; }
  catch { $("dcopy").textContent = "복사 실패"; }
});
</script>
