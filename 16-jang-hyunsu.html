<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장현수 - 물류 운영 데이터 분석 지원</title>
<style>
@font-face{font-family:"SCoreDream";font-weight:300;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-3Light.woff") format("woff");font-display:swap}
@font-face{font-family:"SCoreDream";font-weight:900;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-9Black.woff") format("woff");font-display:swap}

:root{
  --box:#C89B6D; --box-dark:#7A5230; --box-back:#B4875A;
  --paper:#fff; --ink:#000;
  --red:#E52528; --orange:#F6A200; --green:#6DB33F; --sky:#00A3E0;
  --floor:#D3D4D1; --belt:#2B2C2E; --seam:#3D3F42; --rail:#8E9296;
  --B:min(38vw,64vh);
  --rail-w:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
body{
  font-family:"SCoreDream","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-weight:300;color:var(--ink);background:var(--floor);
  overflow-x:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
b,strong{font-weight:900}
button{font:inherit;color:inherit;background:none;border:0;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}

/* ---------- 벨트 ---------- */
.stage{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden}
.belt{
  position:absolute;left:0;right:0;top:50%;
  height:calc(var(--B)*.9 + 9vh);transform:translateY(-50%);
  background-color:var(--belt);
  background-image:repeating-linear-gradient(90deg,transparent 0 158px,var(--seam) 158px 160px);
  background-position:var(--o,0px) 0;
  display:flex;align-items:center;gap:27vw;padding-inline:31vw;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--rail) var(--belt);
}
.stage::before,.stage::after{
  content:"";position:absolute;left:0;right:0;height:var(--rail-w);z-index:1;
  background-color:var(--rail);
  background-image:radial-gradient(circle,var(--belt) 0 2px,transparent 2.5px);
  background-size:64px var(--rail-w);
}
.stage::before{top:calc(50% - (var(--B)*.9 + 9vh)/2 - var(--rail-w))}
.stage::after{top:calc(50% + (var(--B)*.9 + 9vh)/2)}

.lamp{
  position:absolute;z-index:2;left:28px;top:calc(50% - (var(--B)*.9 + 9vh)/2 - var(--rail-w) - 30px);
  display:flex;gap:7px;padding:7px 10px;background:var(--ink);border-radius:20px;
}
.lamp i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.22;transition:opacity .15s}
.lamp[data-s="stop"] i:nth-child(1),
.lamp[data-s="slow"] i:nth-child(2),
.lamp[data-s="run"] i:nth-child(3),
.lamp[data-s="back"] i:nth-child(4){opacity:1}

/* ---------- 벨트 위 물건 ---------- */
.item{
  flex:none;position:relative;
  width:calc(var(--B)*var(--w,1));aspect-ratio:var(--ar,10/9);
  container-type:inline-size;--u:1cqi;
}
.live .belt{display:block;overflow:visible;padding:0}
.live .item{position:absolute;left:0;top:50%;will-change:transform}
.item:hover,.item:focus-within,.item.open{z-index:5}

.lift{
  display:block;position:relative;width:100%;height:100%;
  transition:transform .28s cubic-bezier(.2,0,0,1),box-shadow .28s cubic-bezier(.2,0,0,1);
  box-shadow:0 0 0 rgba(0,0,0,.45);
}
.item.open .lift,.item:has(:focus-visible) .lift{transform:translateY(-10px) scale(1.035);box-shadow:0 20px 0 rgba(0,0,0,.45)}
@media (hover:hover){
  .item:hover .lift{transform:translateY(-10px) scale(1.035);box-shadow:0 20px 0 rgba(0,0,0,.45)}
}

/* 상자 */
.box{perspective:1500px;background:var(--box-dark)}
.box:focus-visible,.mail:focus-visible{outline:3px solid var(--paper);outline-offset:4px;box-shadow:0 0 0 10px var(--ink)}
.flap{
  position:absolute;left:0;right:0;height:50%;display:block;
  background:var(--box-back);
  transition:transform .42s cubic-bezier(.2,0,0,1);
}
.flap.t{top:0;transform-origin:50% 0}
.flap.b{bottom:0;transform-origin:50% 100%}
.face{position:absolute;inset:0;display:block;background:var(--box);transition:opacity .01s .12s}
.box[aria-expanded="true"] .flap.t{transform:rotateX(117deg)}
.box[aria-expanded="true"] .flap.b{transform:rotateX(-117deg)}
.box[aria-expanded="true"] .face{opacity:0}
.tape{position:absolute;left:-1.5%;right:-1.5%;height:calc(var(--u)*3.4);background:var(--tape);display:block}
.flap.t .tape{bottom:0}
.flap.b .tape{top:0}
.mark{position:absolute;right:5%;top:12%;width:calc(var(--u)*17);height:auto;color:var(--box-dark);display:block}

/* 운송장 */
.bill{
  position:absolute;left:4%;right:4%;top:calc(var(--u)*5.6);bottom:calc(var(--u)*2.4);
  background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;
  border:calc(var(--u)*.45) solid var(--ink);
  font-size:calc(var(--u)*2.8);line-height:1.25;
}
.bill > span{display:flex;align-items:center;border-bottom:calc(var(--u)*.3) solid var(--ink)}
.bill > span:last-child{border-bottom:0}
.cell{display:flex;align-items:baseline;gap:.6em;padding:calc(var(--u)*1.3) calc(var(--u)*2);white-space:nowrap}
.cell + .cell{border-left:calc(var(--u)*.3) solid var(--ink)}
.who .cell{flex:1}
.who b{font-size:calc(var(--u)*3.7)}
.what b{font-size:calc(var(--u)*6.4);letter-spacing:-.02em;line-height:1.1}
.nums{align-items:stretch !important}
.nums .cell{flex-direction:column;align-items:flex-start;gap:0;justify-content:center}
.nums b{font-size:calc(var(--u)*9.2);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.nums s{font-weight:300;font-size:.5em;letter-spacing:0;margin-right:.25em;text-decoration-thickness:.09em}
.bars{
  flex:1;align-self:stretch;margin:calc(var(--u)*1.6) calc(var(--u)*2);min-width:calc(var(--u)*8);
  background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 5px,#000 5px 9px,transparent 9px 11px,#000 11px 12px,transparent 12px 16px);
}

/* 상자 안 */
.in{position:absolute;inset:0;display:grid;place-items:center}
.slip{
  display:block;width:80%;background:var(--paper);padding:calc(var(--u)*5) calc(var(--u)*5.5);
  font-size:calc(var(--u)*4.6);line-height:1.3;transform:rotate(-1.5deg) scale(.94);
  transition:transform .42s cubic-bezier(.2,0,0,1);
}
.box[aria-expanded="true"] .slip{transform:rotate(-1.5deg) scale(1)}
.slip > span{display:block;padding:calc(var(--u)*1.7) 0;border-bottom:calc(var(--u)*.3) solid var(--ink)}
.slip > span:last-child{border-bottom:0}

/* 검수 송장 */
.sheet{background:var(--paper);display:flex;flex-direction:column;padding:calc(var(--u)*6);font-size:calc(var(--u)*4.3);line-height:1.3;rotate:-1.6deg}
.sheet .to{display:block;padding-bottom:calc(var(--u)*4);border-bottom:calc(var(--u)*1.1) solid var(--ink)}
.sheet .to b{display:block;font-size:calc(var(--u)*9);line-height:1.1}
.sheet ul{list-style:none;flex:1;display:flex;flex-direction:column}
.sheet li{flex:1;display:grid;grid-template-columns:calc(var(--u)*5) 1fr;align-content:center;border-bottom:calc(var(--u)*.4) solid var(--ink)}
.sheet li::before{content:"";width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;background:var(--green);grid-row:1/3;align-self:center}
.sheet li b{font-size:calc(var(--u)*5.2)}
.sheet .bars{flex:none;height:calc(var(--u)*9);margin:calc(var(--u)*5) 42% 0 0}
.stamp{
  position:absolute;right:6%;bottom:4%;width:calc(var(--u)*25);aspect-ratio:1;border-radius:50%;
  border:calc(var(--u)*1) solid var(--ink);display:grid;place-items:center;
  font-weight:900;font-size:calc(var(--u)*8);rotate:-14deg;
}

/* 회신 소포 */
.parcel{background:var(--box)}
.parcel .tape{left:auto;right:16%;top:-1.5%;bottom:-1.5%;width:calc(var(--u)*6);height:auto}
.parcel .bill{top:11%;bottom:11%;left:6%;right:6%;font-size:calc(var(--u)*4.8);grid-template-rows:auto 1fr auto}
.parcel .who{flex-direction:column;align-items:stretch !important}
.parcel .who .cell{flex-wrap:wrap;gap:0 .6em}
.parcel .who b{font-size:calc(var(--u)*10);line-height:1.1}
.parcel .who .cell span{flex-basis:100%}
.parcel .what b{font-size:calc(var(--u)*6.2)}
.mail{font-weight:900;font-size:calc(var(--u)*5.9);text-decoration-thickness:.08em;text-underline-offset:.18em}

footer{padding:18px 24px 22px;font-size:.8125rem;font-weight:300;line-height:1.5;text-align:center}

/* ---------- 휴대폰: 벨트가 세로 ---------- */
@media (max-width:720px){
  :root{--B:min(80vw,420px);--rail-w:12px}
  .stage{height:auto;min-height:0;overflow:visible}
  .live .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
  .belt{
    position:relative;top:0;left:auto;right:auto;height:auto;transform:none;
    margin-inline:var(--rail-w);flex-direction:column;gap:150px;padding:110px 0;overflow:visible;
    background-image:repeating-linear-gradient(180deg,transparent 0 118px,var(--seam) 118px 120px);
    background-position:0 var(--o,0px);
  }
  .live .belt{position:absolute;inset:0;margin-inline:var(--rail-w)}
  .stage::before,.stage::after{top:0;bottom:0;height:auto;width:var(--rail-w);background-size:var(--rail-w) 64px}
  .stage::before{left:0;right:auto}
  .stage::after{left:auto;right:0}
  .live .item{left:50%;top:0}
  .item{--u:1.45cqi}
  .item:has(.box){aspect-ratio:calc(var(--ar)*.7)}
  .sheet-item{--w:.92 !important}
  .parcel-item{--w:.86 !important}
  .lamp{left:auto;right:22px;top:14px}
  .bill{top:calc(var(--u)*4.6);bottom:calc(var(--u)*1.6);left:3%;right:3%}
  .nums{flex-wrap:wrap}
  .nums b{font-size:calc(var(--u)*7.6)}
  .nums .bars{flex-basis:100%;height:calc(var(--u)*4.4);margin:0 calc(var(--u)*2) calc(var(--u)*1.4)}
  .slip{font-size:calc(var(--u)*3.9);width:86%}
  .sheet{font-size:calc(var(--u)*3.1);padding:calc(var(--u)*4)}
  .sheet .to b{font-size:calc(var(--u)*6.4)}
  .sheet li b{font-size:calc(var(--u)*3.7)}
  .stamp{width:calc(var(--u)*17);font-size:calc(var(--u)*5.4)}
  .parcel .bill{font-size:calc(var(--u)*3.6)}
  .parcel .who b{font-size:calc(var(--u)*6.8)}
  .parcel .what b{font-size:calc(var(--u)*4.3)}
  .mail{font-size:calc(var(--u)*3.8)}
}

@media (prefers-reduced-motion:reduce){
  .lift,.flap,.slip{transition:none}
}
</style>
</head>

<script>
(function(){
  var root=document.documentElement;
  var track=document.querySelector('.track'), stage=document.querySelector('.stage');
  var belt=document.querySelector('.belt'), lamp=document.querySelector('.lamp');
  var items=[].map.call(document.querySelectorAll('.item'),function(el){
    return {el:el,m:+el.dataset.m,r:+el.dataset.r,o:0,ov:0,base:0,size:0,p:0};
  });

  /* 가짜 바코드 */
  [].forEach.call(document.querySelectorAll('.bars'),function(el){
    var s=0,c=el.dataset.code,i,x=0,stops=[];
    for(i=0;i<c.length;i++) s=(s*31+c.charCodeAt(i))>>>0;
    function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296}
    for(i=0;i<46;i++){
      var w=1+Math.floor(rnd()*3), g=1+Math.floor(rnd()*3);
      stops.push('#000 '+x+'px '+(x+w)+'px','transparent '+(x+w)+'px '+(x+w+g)+'px'); x+=w+g;
    }
    el.style.background='repeating-linear-gradient(90deg,'+stops.join(',')+')';
  });

  /* 집으면 열린다 */
  function closeAll(except){
    items.forEach(function(it){
      var b=it.el.querySelector('.box');
      if(b && b!==except){b.setAttribute('aria-expanded','false');it.el.classList.remove('open')}
    });
  }
  items.forEach(function(it){
    var b=it.el.querySelector('.box');
    it.el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')it.hover=true});
    it.el.addEventListener('pointerleave',function(e){
      if(e.pointerType!=='mouse')return; it.hover=false;
      if(b){b.setAttribute('aria-expanded','false');it.el.classList.remove('open')}
    });
    it.el.addEventListener('focusin',function(e){if(e.target.matches(':focus-visible'))it.focus=true});
    it.el.addEventListener('focusout',function(){it.focus=false});
    if(!b)return;
    b.addEventListener('click',function(){
      var open=b.getAttribute('aria-expanded')!=='true';
      closeAll(b); b.setAttribute('aria-expanded',open); it.el.classList.toggle('open',open);
    });
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});

  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  /* 벨트 */
  root.classList.add('live');
  var narrow=matchMedia('(max-width:720px)');
  var vertical,L,margin,view,off0,drift=0,v=0,vPrev=0,last=0,prevOffset=null;
  var px=null;

  function layout(){
    vertical=narrow.matches;
    view=vertical?stage.clientHeight:stage.clientWidth;
    var gap=vertical?Math.max(150,innerHeight*.19):innerWidth*.27, acc=0, max=0;
    items.forEach(function(it){
      it.size=vertical?it.el.offsetHeight:it.el.offsetWidth;
      if(it.size>max)max=it.size;
    });
    margin=max+160;
    var need=view+margin, sum=0;
    items.forEach(function(it){sum+=it.size});
    if(sum+gap*items.length<need) gap=(need-sum)/items.length;
    items.forEach(function(it){it.base=acc;acc+=it.size+gap});
    L=acc;
    off0=vertical?Math.min(120,(view-items[0].size)/2):(view-items[0].size)/2;
    track.style.height=vertical?(innerHeight+L)+'px':'';
    prevOffset=null;
  }
  function mod(a,n){return ((a%n)+n)%n}

  stage.addEventListener('pointermove',function(e){px=e.clientX/innerWidth});
  ['pointerleave','pointercancel'].forEach(function(t){stage.addEventListener(t,function(){px=null})});
  stage.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')px=null});

  function frame(t){
    var dt=Math.min(.05,(t-last)/1000||.016); last=t;
    var held=null,hold=false;
    items.forEach(function(it){
      if(it.focus)held=it;
      if(it.hover||it.focus||it.el.classList.contains('open'))hold=true;
    });
    var idle=vertical?-22:-innerWidth*.034, target=idle;
    if(hold) target=0;
    else if(!vertical && px!==null){
      var n=(px-.5)*2, f=Math.sign(n)*Math.pow(Math.abs(n),1.6);
      target=f*innerWidth*.8+idle*(1-Math.abs(f));
    }
    v+=(target-v)*(1-Math.exp(-dt*4.5));
    drift+=v*dt;
    if(held){ /* 키보드로 고른 상자는 가운데로 */
      var want=(view-held.size)/2;
      drift+=(want-held.p)*(1-Math.exp(-dt*7));
    }
    var offset=off0+drift-(vertical?scrollY:0);
    var vel=prevOffset===null?v:(offset-prevOffset)/dt; prevOffset=offset;
    var acc=Math.max(-5000,Math.min(5000,(vel-vPrev)/dt)); vPrev=vel;

    items.forEach(function(it){
      it.p=mod(it.base+offset+margin,L)-margin;
      it.ov+=(-130*it.o-10*it.ov-acc*it.m*22)*dt;
      it.o=Math.max(-46,Math.min(46,it.o+it.ov*dt));
      var rot=Math.max(-7,Math.min(7,it.o*it.r)), p=(it.p+it.o).toFixed(1);
      it.el.style.transform=vertical
        ?'translate3d(-50%,'+p+'px,0) rotate('+rot.toFixed(2)+'deg)'
        :'translate3d('+p+'px,-50%,0) rotate('+rot.toFixed(2)+'deg)';
    });
    belt.style.setProperty('--o',mod(offset,vertical?120:160).toFixed(1)+'px');
    var a=Math.abs(vel), s=a<6?'stop':(a<innerWidth*.06||vertical&&a<60)?'slow':vel>0?'back':'run';
    if(lamp.dataset.s!==s)lamp.dataset.s=s;
    requestAnimationFrame(frame);
  }

  layout();
  addEventListener('resize',layout);
  requestAnimationFrame(frame);
})();
</script>
