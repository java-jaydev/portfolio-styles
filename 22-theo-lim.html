<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Theo Lim, Senior Product Designer</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700,900&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #ECECEA;
    --dot: #BDBDB8;
    --ink: #000;
    --paper: #fff;
    --fill: #DEDEDB;
    --blue: #0B5FFF;
    --c1: #C2410C;
    --c2: #15803D;
    --c3: #7C3AED;
    --iz: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: "Satoshi", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--board);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--blue); color: #fff; }

  #vp {
    position: fixed; inset: 0; overflow: hidden;
    touch-action: none; cursor: grab;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    background-color: var(--board);
    background-image: radial-gradient(circle at 1.5px 1.5px, var(--dot) 1.2px, transparent 1.7px);
  }
  #vp.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }

  /* things on the board */
  .frame, .scrap, .note { position: absolute; }
  .frame { outline: none; }
  .frame:focus-visible::before {
    content: ""; position: absolute; inset: -22px;
    border: calc(2px * var(--iz)) solid var(--blue);
    pointer-events: none;
  }
  .tag { position: absolute; font-size: 15px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
  .tag b { font-weight: 900; font-size: 26px; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
  .tag.r { text-align: right; }

  .note {
    left: -128px; top: -58px; width: 256px;
    background: var(--paper); border: 1.5px solid var(--ink);
    padding: 15px 18px 16px; rotate: -2deg;
  }
  .note h1 { font-size: 23px; font-weight: 900; letter-spacing: -0.015em; line-height: 1.15; }
  .note p { font-size: 14px; line-height: 1.4; margin-top: 3px; }
  .note a {
    display: inline-block; margin-top: 9px; font-size: 14px; font-weight: 700; color: var(--ink);
    text-decoration-thickness: 1.5px; text-underline-offset: 3px;
    user-select: text; -webkit-user-select: text; cursor: pointer;
  }
  .note a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  @media (hover: hover) { .note a:hover { color: var(--blue); } }

  /* wireframe pieces */
  .ph, .sc {
    position: absolute; background: var(--paper); border: 1.5px solid var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ph { border-radius: 16px; padding: 16px 12px 12px; gap: 9px; }
  .sc { border-radius: 6px; padding: 8px 7px; gap: 5px; border-width: 1.2px; }
  .ph > *, .sc > * { flex: none; }
  .b { display: block; background: var(--ink); height: 6px; border-radius: 1px; }
  .b.g { background: var(--fill); }
  .bx { background: var(--fill); }
  .f { border: 1.5px solid var(--ink); height: 26px; border-radius: 3px; }
  .btn { background: var(--ink); height: 28px; border-radius: 14px; margin-top: auto; }
  .btn.o { background: none; border: 1.5px solid var(--ink); }
  .rw { display: flex; align-items: center; gap: 7px; }
  .rw > u { width: 20px; height: 20px; border-radius: 50%; background: var(--fill); flex: none; }
  .rw > span { flex: 1; display: grid; gap: 4px; }
  .kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px 12px; justify-items: center; margin-top: auto; }
  .kp > u { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .gd { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .gd > u { aspect-ratio: 1; background: var(--fill); }
  .pin { display: flex; gap: 7px; justify-content: center; margin: 14px 0; }
  .pin > u { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
  .pin > u:nth-child(n+4) { background: none; border: 1.5px solid var(--ink); }
  .av { display: flex; gap: 8px; }
  .av > u { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); }
  .av > u:first-child { background: none; border: 2px solid var(--ink); }
  .ok { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--ink); margin: 46px auto 12px; position: relative; }
  .ok::after { content: ""; position: absolute; left: 21px; top: 15px; width: 17px; height: 27px; border: solid var(--ink); border-width: 0 3px 3px 0; rotate: 42deg; }
  .mid { margin-inline: auto; }
  u { text-decoration: none; display: block; }

  /* discarded */
  .x > * { opacity: .55; }
  .x::after {
    content: ""; position: absolute; inset: 0; opacity: 1;
    background:
      linear-gradient(to top right, transparent calc(50% - 1px), var(--ink) calc(50% - 1px), var(--ink) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom right, transparent calc(50% - 1px), var(--ink) calc(50% - 1px), var(--ink) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .pale .b, .pale .btn { background: #CFCFCB; }
  .pale .f { border-color: #CFCFCB; }

  /* the one picked */
  .sel { position: absolute; border: 1.5px solid var(--blue); pointer-events: none; }
  .sel > u { position: absolute; width: 9px; height: 9px; background: var(--paper); border: 1.5px solid var(--blue); }
  .sel > u:nth-child(1) { left: -5px; top: -5px; }
  .sel > u:nth-child(2) { right: -5px; top: -5px; }
  .sel > u:nth-child(3) { left: -5px; bottom: -5px; }
  .sel > u:nth-child(4) { right: -5px; bottom: -5px; }

  /* component sheet */
  .sheet {
    position: absolute; left: 0; top: 0; background: var(--paper); border: 1.5px solid var(--ink);
    padding: 26px; display: grid; grid-template-columns: repeat(12, 62px); grid-auto-rows: 44px; gap: 16px 20px;
  }
  .sheet > div { display: flex; align-items: center; justify-content: center; gap: 5px; }
  .dots { position: absolute; display: grid; grid-template-columns: repeat(20, 12px); gap: 8px; }
  .dots > u { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }

  /* other people */
  .cur { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 5; }
  .cur svg { position: absolute; left: -2px; top: -2px; width: 22px; height: 24px; transform: scale(var(--iz)); transform-origin: 2px 2px; overflow: visible; }
  .say {
    position: absolute; z-index: 4; pointer-events: none;
    transform: scale(var(--iz)); transform-origin: 0 0;
  }
  .say > span {
    display: block; padding: 7px 11px 8px; border-radius: 2px 13px 13px 13px;
    color: #fff; font-size: 13px; font-weight: 700; line-height: 1.25; white-space: nowrap;
    transition: opacity .35s ease-out, scale .35s cubic-bezier(.2, 0, 0, 1);
    transform-origin: 0 0;
  }
  .say.off > span { opacity: 0; scale: .6; }

  /* corner */
  #map {
    position: fixed; right: 16px; bottom: 16px; width: 170px; height: 127px;
    background: var(--paper); border: 1.5px solid var(--ink); overflow: hidden;
    cursor: crosshair; touch-action: none;
  }
  #map > i { position: absolute; background: #C9C9C5; }
  #map > i.k { background: var(--ink); }
  #map > u { position: absolute; width: 5px; height: 5px; border-radius: 50%; margin: -2.5px; }
  #mapview { position: absolute; border: 1.5px solid var(--blue); background: rgb(11 95 255 / .1); }
  .fine { position: fixed; left: 16px; bottom: 14px; font-size: 12px; line-height: 1.3; color: #4A4A47; pointer-events: none; }
  @media (max-width: 560px) {
    #map { width: 112px; height: 84px; right: 12px; bottom: 12px; }
    .fine { left: 12px; bottom: 12px; max-width: calc(100vw - 148px); }
  }
</style>
</head>
<body>
<main id="vp">
  <div id="world">

    <section class="frame" id="f-transfer" tabindex="0" aria-label="Bank app transfer flow" style="left:600px;top:-430px;width:1162px;height:860px">
      <div id="old-flow"></div>
      <p class="tag r" style="right:0;top:298px">Bank app transfer, <b>7</b> screens</p>
      <div id="new-flow"></div>
      <div class="sel" style="left:-12px;top:358px;width:654px;height:404px"><u></u><u></u><u></u><u></u></div>
      <p class="tag" style="left:670px;top:690px"><b>3</b> screens<br><b>40%</b> fewer wrong-transfer inquiries</p>
    </section>

    <section class="frame" id="f-system" tabindex="0" aria-label="Design system" style="left:-1690px;top:-330px;width:1019px;height:560px">
      <div class="sheet" id="sheet"></div>
      <p class="tag" style="left:0;top:478px"><b>84</b> components</p>
      <p class="tag" style="left:250px;top:478px"><b>4</b> teams</p>
      <p class="tag" style="left:420px;top:478px">New screens in <b>half</b> the time</p>
    </section>

    <section class="frame" id="f-access" tabindex="0" aria-label="Accessibility overhaul" style="left:-470px;top:810px;width:800px;height:370px">
      <div id="aa"></div>
      <div class="sel" style="left:178px;top:-10px;width:170px;height:310px"><u></u><u></u><u></u><u></u></div>
      <p class="tag" style="left:0;top:306px"><b>2.1:1</b></p>
      <p class="tag" style="left:188px;top:306px"><b>12.6:1</b></p>
      <div class="dots" id="dots" style="left:400px;top:34px"></div>
      <p class="tag" style="left:400px;top:306px"><b>212</b> contrast failures fixed</p>
    </section>

    <section class="frame" id="f-pile" tabindex="0" aria-label="Discarded drafts" style="left:-700px;top:-1420px;width:1400px;height:680px">
      <div id="pile"></div>
      <p class="tag" style="left:0;top:640px"><b>60+</b> discarded</p>
    </section>

    <div id="strays"></div>

    <div class="note">
      <h1>Theo Lim</h1>
      <p>Senior Product Designer, 7 years</p>
      <a href="mailto:theo@example.com">theo@example.com</a>
    </div>

  </div>
</main>

<div id="map" aria-hidden="true"><div id="mapview"></div></div>
<p class="fine">A fictional person, made as a demo.</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const vp = $('vp'), world = $('world'), map = $('map'), mapview = $('mapview');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- drawing ---------- */
  const bar = (w, h = 6, g = 0, cls = '') => `<i class="b${g ? ' g' : ''} ${cls}" style="width:${w}%;height:${h}px"></i>`;
  const box = h => `<u class="bx" style="height:${h}px"></u>`;
  const field = (h = 26) => `<u class="f" style="height:${h}px"></u>`;
  const btn = (o = 0) => `<u class="btn${o ? ' o' : ''}"></u>`;
  const row = (a = 70, b = 40) => `<div class="rw"><u></u><span>${bar(a, 5)}${bar(b, 5, 1)}</span></div>`;
  const rep = (n, s) => Array.from({ length: n }, (_, i) => typeof s === 'function' ? s(i) : s).join('');
  const keypad = `<div class="kp">${rep(12, '<u></u>')}</div>`;
  const title = bar(46, 8);

  const oldScreens = [
    title + field(22) + rep(5, i => row(55 + (i * 13) % 30, 30 + (i * 7) % 25)),
    title + `<div class="gd">${rep(12, '<u></u>')}</div>`,
    title + bar(30, 5, 1) + field() + bar(40, 5, 1) + field() + btn(),
    title + bar(58, 18, 0, 'mid') + bar(30, 5, 1, 'mid') + keypad,
    title + field(70) + `<div class="rw">${bar(26, 14, 1)}${bar(26, 14, 1)}${bar(26, 14, 1)}</div>` + btn(),
    title + box(64) + rep(3, `<div class="rw">${bar(30, 5, 1)}<span></span>${bar(34, 5)}</div>`) + btn(),
    title + bar(60, 5, 1, 'mid') + `<div class="pin">${rep(6, '<u></u>')}</div>` + keypad
  ];
  $('old-flow').innerHTML = oldScreens.map((s, i) =>
    `<div class="ph x" style="left:${i * 170}px;top:0;width:142px;height:284px">${s}</div>`).join('');

  const newScreens = [
    `<div class="av">${rep(5, '<u></u>')}</div>` + field(30) + bar(62, 22, 0, 'mid') + bar(28, 5, 1, 'mid') + keypad,
    title + `<div class="f" style="height:auto;padding:12px 10px">${row(64, 44)}</div>` +
      rep(3, `<div class="rw">${bar(30, 5, 1)}<span></span>${bar(36, 5)}</div>`) + btn(),
    `<u class="ok"></u>` + bar(52, 9, 0, 'mid') + bar(36, 5, 1, 'mid') + btn(1)
  ];
  $('new-flow').innerHTML = newScreens.map((s, i) =>
    `<div class="ph" style="left:${i * 220}px;top:370px;width:190px;height:380px;gap:12px;padding:20px 15px 15px;border-width:2px">${s}</div>`).join('');

  /* 12 kinds x 7 variants = 84 */
  const K = '#000', G = 'var(--fill)';
  const comp = (c, r) => {
    const off = r === 6;
    switch (c) {
      case 0: return `<u style="width:${34 + r * 4}px;height:20px;border-radius:10px;background:${off ? G : K}"></u>`;
      case 1: return `<u style="width:${34 + r * 4}px;height:20px;border-radius:10px;border:${r === 3 ? 2.5 : 1.5}px solid ${off ? G : K}"></u>`;
      case 2: return `<u style="width:60px;height:22px;border-radius:3px;border:${r === 3 ? 2.5 : 1.5}px solid ${off ? G : K};padding:7px 6px"><u style="height:5px;width:${r * 14}%;background:${off ? G : K}"></u></u>`;
      case 3: return `<u style="width:${30 + (r % 3) * 4}px;height:${16 + (r % 3) * 2}px;border-radius:12px;border:1.5px solid ${K};background:${r % 2 ? K : 'none'};padding:2px;display:flex;justify-content:${r % 2 ? 'flex-end' : 'flex-start'}"><u style="height:100%;aspect-ratio:1;border-radius:50%;background:${r % 2 ? '#fff' : K}"></u></u>`;
      case 4: return `<u style="width:16px;height:16px;border-radius:3px;border:1.5px solid ${K};background:${r % 2 ? K : 'none'}"></u><u style="width:${14 + r * 4}px;height:5px;background:${K}"></u>`;
      case 5: return `<u style="width:16px;height:16px;border-radius:50%;border:${r % 2 ? 5 : 1.5}px solid ${K}"></u><u style="width:${14 + r * 4}px;height:5px;background:${K}"></u>`;
      case 6: return `<u style="height:20px;padding:0 8px;border-radius:10px;border:1.5px solid ${K};display:flex;align-items:center;gap:4px;background:${r % 3 === 2 ? K : 'none'}"><u style="width:7px;height:7px;border-radius:50%;background:${r % 3 === 2 ? '#fff' : K}"></u><u style="width:${12 + r * 3}px;height:5px;background:${r % 3 === 2 ? '#fff' : K}"></u></u>`;
      case 7: return `<u style="width:58px;height:14px;position:relative"><u style="position:absolute;inset:6px 0 auto;height:2px;background:${G}"></u><u style="position:absolute;top:6px;left:0;width:${8 + r * 14}%;height:2px;background:${K}"></u><u style="position:absolute;top:0;left:calc(${8 + r * 14}% - 7px);width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid ${K}"></u></u>`;
      case 8: return `<u style="width:${16 + r * 4}px;height:${16 + r * 4}px;border-radius:${r % 2 ? '28%' : '50%'};background:${G};border:1.5px solid ${K}"></u>`;
      case 9: return `<u style="display:flex;gap:6px;align-items:flex-start">${rep(3, i => `<u style="width:15px;height:5px;background:${i === r % 3 ? K : G};box-shadow:${i === r % 3 ? '0 7px 0 -1.5px ' + K : 'none'}"></u>`)}</u>`;
      case 10: return `<u style="display:flex;gap:2px">${rep(7, i => `<u style="width:6px;height:10px;background:${i <= r ? K : G}"></u>`)}</u>`;
      default: return `<u style="width:${14 + (r % 2) * 4}px;height:${14 + (r % 2) * 4}px;border-radius:50%;background:${G}"></u><u style="display:grid;gap:4px"><u style="width:${22 + r * 3}px;height:5px;background:${K}"></u><u style="width:${14 + r * 2}px;height:5px;background:${G}"></u></u>`;
    }
  };
  $('sheet').innerHTML = rep(84, i => `<div>${comp(i % 12, Math.floor(i / 12))}</div>`);

  const aaScreen = title + bar(80, 5) + bar(64, 5) + field() + bar(72, 5) + bar(50, 5) + btn();
  $('aa').innerHTML =
    `<div class="ph x pale" style="left:0;top:0;width:150px;height:290px">${aaScreen}</div>` +
    `<div class="ph" style="left:188px;top:0;width:150px;height:290px">${aaScreen}</div>`;
  $('dots').innerHTML = rep(212, '<u></u>');

  /* discarded drafts: seeded so the pile is the same every visit */
  let seed = 22;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const scrap = (cx, cy) => {
    const kind = pick(['p', 'p', 'w', 'q']);
    const [w, h] = kind === 'p' ? [70, 124] : kind === 'w' ? [138, 92] : [100, 100];
    const parts = [
      () => bar(30 + rnd() * 50, 5), () => bar(30 + rnd() * 60, 4, 1),
      () => box(kind === 'p' ? 30 : 22), () => field(14),
      () => `<div class="rw"><u style="width:12px;height:12px"></u><span>${bar(70, 4)}</span></div>`,
      () => `<div class="rw">${bar(30, 16, 1)}${bar(30, 16, 1)}${bar(30, 16, 1)}</div>`
    ];
    const n = kind === 'p' ? 4 + Math.floor(rnd() * 2) : 3;
    let s = bar(40, 6);
    for (let i = 0; i < n; i++) s += pick(parts)();
    if (rnd() > .4) s += `<u class="btn" style="height:13px"></u>`;
    return `<div class="sc x scrap" style="left:${Math.round(cx - w / 2)}px;top:${Math.round(cy - h / 2)}px;width:${w}px;height:${h}px;rotate:${(rnd() * 14 - 7).toFixed(1)}deg">${s}</div>`;
  };
  let pile = '';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 11; c++)
    pile += scrap(70 + c * 126 + (rnd() * 44 - 22), 66 + r * 124 + (rnd() * 40 - 20));
  $('pile').innerHTML = pile;
  $('strays').innerHTML = [[-430, -260], [-190, -350], [215, -320], [440, -190], [-480, 70], [-330, 300], [130, 310], [395, 300], [-150, 392]]
    .map(p => scrap(p[0], p[1])).join('');

  /* ---------- camera ---------- */
  const B = { x0: -1820, y0: -1520, x1: 1900, y1: 1250 };
  const ZMIN = .22, ZMAX = 3;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const homeZ = () => clamp(Math.min(innerWidth / 1500, innerHeight / 940), .85, 1.4);
  const cam = { x: 0, y: 0, z: homeZ() };
  let vel = { x: 0, y: 0 }, zt = cam.z, za = null, fly = null;

  const mapItems = [];
  const mk = (W, H) => { const s = W / (B.x1 - B.x0); return { s, oy: (H - (B.y1 - B.y0) * s) / 2 }; };
  function buildMap() {
    mapItems.forEach(m => m.remove()); mapItems.length = 0;
    const { s, oy } = mk(map.clientWidth, map.clientHeight);
    const add = (x, y, w, h, k) => {
      const i = document.createElement('i'); if (k) i.className = 'k';
      i.style.cssText = `left:${(x - B.x0) * s}px;top:${(y - B.y0) * s + oy}px;width:${Math.max(2, w * s)}px;height:${Math.max(2, h * s)}px`;
      map.insertBefore(i, mapview); mapItems.push(i);
    };
    world.querySelectorAll('.frame').forEach(f => {
      f.querySelectorAll('.ph, .sc, .sheet, .dots').forEach(e => add(f.offsetLeft + e.offsetLeft, f.offsetTop + e.offsetTop, e.offsetWidth, e.offsetHeight));
    });
    $('strays').querySelectorAll('.sc').forEach(e => add(e.offsetLeft, e.offsetTop, e.offsetWidth, e.offsetHeight));
    add(-128, -58, 256, 110, 1);
  }

  function apply() {
    cam.x = clamp(cam.x, B.x0, B.x1); cam.y = clamp(cam.y, B.y0, B.y1);
    const w = innerWidth, h = innerHeight, ox = w / 2 - cam.x * cam.z, oy = h / 2 - cam.y * cam.z;
    world.style.transform = `translate(${ox}px,${oy}px) scale(${cam.z})`;
    let g = 24 * cam.z; while (g < 15) g *= 2;
    vp.style.backgroundSize = `${g}px ${g}px`;
    vp.style.backgroundPosition = `${ox - 1.5}px ${oy - 1.5}px`;
    document.documentElement.style.setProperty('--iz', Math.min(2.4, 1 / cam.z).toFixed(3));
    const m = mk(map.clientWidth, map.clientHeight);
    mapview.style.cssText = `left:${(cam.x - w / 2 / cam.z - B.x0) * m.s}px;top:${(cam.y - h / 2 / cam.z - B.y0) * m.s + m.oy}px;width:${w / cam.z * m.s}px;height:${h / cam.z * m.s}px`;
  }
  function zoomAt(sx, sy, nz) {
    nz = clamp(nz, ZMIN, ZMAX);
    const dx = sx - innerWidth / 2, dy = sy - innerHeight / 2;
    cam.x += dx / cam.z - dx / nz; cam.y += dy / cam.z - dy / nz; cam.z = nz;
  }
  function flyTo(x, y, z) {
    vel.x = vel.y = 0; zt = z; za = null;
    if (still) { cam.x = x; cam.y = y; cam.z = z; fly = null; return; }
    fly = { x0: cam.x, y0: cam.y, z0: cam.z, x, y, z, t: 0 };
  }
  function fit(el) {
    const w = el.offsetWidth, h = el.offsetHeight;
    const z = clamp(Math.min(innerWidth * .88 / w, (innerHeight - 60) * .84 / h), ZMIN, 1.5);
    flyTo(el.offsetLeft + w / 2, el.offsetTop + h / 2, z);
  }
  const stop = () => { fly = null; vel.x = vel.y = 0; };

  /* drag, pinch */
  const pts = new Map();
  let travel = 0, downOn = null, lastT = 0, pinchD = 0;
  vp.addEventListener('mousedown', e => { if (!e.target.closest('a')) e.preventDefault(); });
  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('a')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stop(); zt = cam.z; za = null;
    if (pts.size === 1) { travel = 0; downOn = e.target.closest('.frame'); lastT = e.timeStamp; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); downOn = null; }
    vp.classList.add('drag');
  });
  vp.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      travel += Math.abs(dx) + Math.abs(dy);
      cam.x -= dx / cam.z; cam.y -= dy / cam.z;
      const dt = Math.max(1, e.timeStamp - lastT); lastT = e.timeStamp;
      vel.x = vel.x * .6 + (dx / dt) * .4; vel.y = vel.y * .6 + (dy / dt) * .4;
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.x -= dx / 2 / cam.z; cam.y -= dy / 2 / cam.z;
      if (pinchD) zoomAt(mx, my, cam.z * d / pinchD);
      pinchD = d; zt = cam.z; vel.x = vel.y = 0;
    }
  });
  const up = e => {
    if (!pts.delete(e.pointerId)) return;
    if (pts.size === 0) {
      vp.classList.remove('drag');
      if (travel < 6 && downOn && e.type === 'pointerup') { vel.x = vel.y = 0; fit(downOn); }
      else if (still || e.timeStamp - lastT > 90) vel.x = vel.y = 0;
      downOn = null;
    } else vel.x = vel.y = 0;
  };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);

  vp.addEventListener('wheel', e => {
    e.preventDefault(); fly = null; vel.x = vel.y = 0;
    const unit = e.deltaMode === 1 ? 16 : 1;
    zt = clamp(zt * Math.exp(-e.deltaY * unit * (e.ctrlKey ? .012 : .0022)), ZMIN, ZMAX);
    za = { x: e.clientX, y: e.clientY };
    if (still) { zoomAt(za.x, za.y, zt); }
  }, { passive: false });
  addEventListener('gesturestart', e => e.preventDefault());

  /* keys */
  const held = new Set(); const kv = { x: 0, y: 0 };
  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (ARROWS[e.key]) { held.add(e.key); fly = null; e.preventDefault(); }
    else if (e.key === '+' || e.key === '=') { fly = null; zt = clamp(zt * 1.3, ZMIN, ZMAX); za = null; if (still) zoomAt(innerWidth / 2, innerHeight / 2, zt); }
    else if (e.key === '-' || e.key === '_') { fly = null; zt = clamp(zt / 1.3, ZMIN, ZMAX); za = null; if (still) zoomAt(innerWidth / 2, innerHeight / 2, zt); }
    else if (e.key === '0' || e.key === 'Home' || e.key === 'Escape') { flyTo(0, 0, homeZ()); }
    else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.classList.contains('frame')) { e.preventDefault(); fit(document.activeElement); }
  });
  addEventListener('keyup', e => held.delete(e.key));
  addEventListener('blur', () => held.clear());
  world.querySelectorAll('.frame').forEach(f => f.addEventListener('focus', () => { if (f.matches(':focus-visible')) fit(f); }));
  world.querySelector('.note a').addEventListener('focus', e => { if (e.target.matches(':focus-visible')) flyTo(0, 0, homeZ()); });

  /* corner map */
  let mapDown = false;
  const mapGo = e => {
    const r = map.getBoundingClientRect(), m = mk(r.width, r.height);
    stop(); cam.x = (e.clientX - r.left) / m.s + B.x0; cam.y = (e.clientY - r.top - m.oy) / m.s + B.y0;
  };
  map.addEventListener('pointerdown', e => { mapDown = true; map.setPointerCapture(e.pointerId); mapGo(e); });
  map.addEventListener('pointermove', e => { if (mapDown) mapGo(e); });
  map.addEventListener('pointerup', () => mapDown = false);
  map.addEventListener('pointercancel', () => mapDown = false);

  /* ---------- other people ---------- */
  const T = { x: 600, y: -430 }, S = { x: -1690, y: -330 }, A = { x: -470, y: 810 }, P = { x: -700, y: -1420 };
  const people = [
    { c: 'var(--c1)', at: [300, 130], route: [
      [T.x + 760, T.y + 150, '7 screens to send $20?'], [T.x + 420, T.y + 200], [T.x + 310, T.y + 500, 'Name check stays'],
      [T.x + 540, T.y + 640], [430, 250], [150, 330], [T.x + 80, T.y + 120], [T.x + 1080, T.y + 210] ] },
    { c: 'var(--c2)', at: [-390, -110], route: [
      [S.x + 700, S.y + 120], [S.x + 330, S.y + 260, 'Toggle: keep 2 sizes'], [S.x + 120, S.y + 90], [S.x + 860, S.y + 380],
      [-470, 90], [A.x + 560, A.y + 140, '212 of 212'], [A.x + 640, A.y + 60], [-330, 320] ] },
    { c: 'var(--c3)', at: [130, -340], route: [
      [P.x + 520, P.y + 420], [P.x + 830, P.y + 200, 'Bring this one back?'], [P.x + 1150, P.y + 470], [215, -300],
      [-60, 480], [A.x + 80, A.y + 120, 'Body text fails AA'], [A.x + 270, A.y + 180], [-190, -340], [P.x + 240, P.y + 300] ] }
  ];
  const dots = [];
  people.forEach((p, i) => {
    const el = document.createElement('div'); el.className = 'cur'; el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<svg viewBox="0 0 22 24"><path d="M2 2 L2 19 L7 14.5 L10.4 22 L13.6 20.5 L10.3 13.2 L17 13 Z" fill="${p.c}" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
    world.appendChild(el); p.el = el;
    p.x = p.at[0]; p.y = p.at[1]; p.i = 0; p.wait = 1.2 + i * 1.1; p.seg = null;
    const d = document.createElement('u'); d.style.background = p.c; map.appendChild(d); dots.push(d);
  });
  function say(p, x, y, text, keep) {
    const el = document.createElement('div'); el.className = 'say off'; el.setAttribute('aria-hidden', 'true');
    el.style.left = (x + 14) + 'px'; el.style.top = (y + 20) + 'px';
    el.innerHTML = `<span style="background:${p.c}"></span>`; el.firstChild.textContent = text;
    world.appendChild(el);
    if (keep) { el.classList.remove('off'); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('off')));
    setTimeout(() => { el.classList.add('off'); setTimeout(() => el.remove(), 400); }, 11000);
  }
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function people_step(dt, now) {
    people.forEach((p, i) => {
      if (p.seg) {
        const s = p.seg; s.t = Math.min(1, s.t + dt / s.d);
        const k = ease(s.t), bend = Math.sin(Math.PI * k) * s.b;
        p.x = s.x0 + (s.x1 - s.x0) * k + s.nx * bend; p.y = s.y0 + (s.y1 - s.y0) * k + s.ny * bend;
        if (s.t === 1) { p.seg = null; p.wait = 1.4 + ((i * 7 + p.i * 3) % 5) * .5; if (s.say) { say(p, p.x, p.y, s.say); p.wait += 2.6; } }
      } else {
        p.wait -= dt;
        p.x += Math.sin(now / 420 + i * 2) * .12; p.y += Math.cos(now / 510 + i) * .1;
        if (p.wait <= 0) {
          const [x1, y1, text] = p.route[p.i % p.route.length]; p.i++;
          const dx = x1 - p.x, dy = y1 - p.y, len = Math.hypot(dx, dy) || 1;
          p.seg = { x0: p.x, y0: p.y, x1, y1, t: 0, d: clamp(len / 620, .7, 3.4), nx: -dy / len, ny: dx / len, b: len * .12 * (p.i % 2 ? 1 : -1), say: text };
        }
      }
    });
  }
  function people_draw() {
    const m = mk(map.clientWidth, map.clientHeight);
    people.forEach((p, i) => {
      p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px)`;
      dots[i].style.left = (p.x - B.x0) * m.s + 'px'; dots[i].style.top = ((p.y - B.y0) * m.s + m.oy) + 'px';
    });
  }
  if (still) {
    people.forEach(p => p.route.forEach(r => { if (r[2]) say(p, r[0], r[1], r[2], true); }));
  }

  /* ---------- loop ---------- */
  let prev = performance.now();
  function tick(now) {
    const dt = Math.min(.05, (now - prev) / 1000); prev = now;
    if (fly) {
      fly.t = Math.min(1, fly.t + dt / .7);
      const k = fly.t === 1 ? 1 : 1 - Math.pow(2, -10 * fly.t);
      cam.x = fly.x0 + (fly.x - fly.x0) * k; cam.y = fly.y0 + (fly.y - fly.y0) * k;
      cam.z = fly.z0 * Math.pow(fly.z / fly.z0, k);
      if (fly.t === 1) fly = null;
    } else {
      if (!pts.size && (Math.abs(vel.x) > .01 || Math.abs(vel.y) > .01)) {
        cam.x -= vel.x * dt * 1000 / cam.z; cam.y -= vel.y * dt * 1000 / cam.z;
        const f = Math.exp(-dt / .32); vel.x *= f; vel.y *= f;
      }
      let ax = 0, ay = 0; held.forEach(k => { ax += ARROWS[k][0]; ay += ARROWS[k][1]; });
      const kf = still ? 1 : 1 - Math.exp(-dt / .09);
      kv.x += (ax * 900 - kv.x) * kf; kv.y += (ay * 900 - kv.y) * kf;
      if (Math.abs(kv.x) > 1 || Math.abs(kv.y) > 1) { cam.x += kv.x * dt / cam.z; cam.y += kv.y * dt / cam.z; }
      if (Math.abs(Math.log(zt / cam.z)) > .002) {
        const a = za || { x: innerWidth / 2, y: innerHeight / 2 };
        zoomAt(a.x, a.y, cam.z * Math.pow(zt / cam.z, 1 - Math.exp(-dt / .07)));
      }
    }
    if (!still) people_step(dt, now);
    people_draw(); apply();
    requestAnimationFrame(tick);
  }
  addEventListener('resize', () => { buildMap(); apply(); });
  buildMap(); apply(); people_draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
